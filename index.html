<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Калькулятор стоимости заказа</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='4' width='44' height='56' rx='8' fill='%231d4e89'/%3E%3Crect x='17' y='11' width='30' height='13' rx='3' fill='%23dbeafe'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='21' cy='33' r='3'/%3E%3Ccircle cx='32' cy='33' r='3'/%3E%3Ccircle cx='43' cy='33' r='3'/%3E%3Ccircle cx='21' cy='44' r='3'/%3E%3Ccircle cx='32' cy='44' r='3'/%3E%3Ccircle cx='43' cy='44' r='3'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <script src="calculator.js" defer></script>
</head>

<body>
    <header>
        <img src="panier.png" alt="Изображение" width="100" height="100">
        <h1>Калькулятор стоимости заказа</h1>
    </header>
    <main class="card">
        <h1>Калькулятор</h1>
        <form id="calc-form">
            <label for="quantity">Количество товара</label>
            <input id="quantity" name="quantity" type="text" autocomplete="off">
            <label for="product">Товар</label>
            <select id="product" name="product">
                <option value="150">Тетрадь — 150 ₽</option>
                <option value="450">Книга — 450 ₽</option>
                <option value="1200">Рюкзак — 1200 ₽</option>
                <option value="50000">Ноутбук — 50000 ₽</option>
            </select>

            <button id="calc-button" type="submit">Рассчитать стоимость</button>
        </form>
        <div id="result" aria-live="polite"></div>
    </main>
    <footer>© 2026 · Калькулятор стоимости заказа</footer>
</body>

</html>
